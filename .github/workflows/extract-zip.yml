name: Extract Stickman Android Project

on:
  push:
    branches:
      - copilot/stickman-studio-arabic

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4
        with:
          ref: copilot/stickman-studio-arabic
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          ZIP="Stickman-Studio-Arabic-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/stickman-source
          unzip -q "$ZIP" -d /tmp/stickman-source

          PROJECT_ROOT=$(find /tmp/stickman-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. .
          rm "$ZIP"

      - name: Save extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project [skip ci]"
            git push
          fi
